# steam.cfg — RetroArch overrides for launching as a non-Steam game (Big Picture).
# The Steam shortcut runs `retroarch --appendconfig ~/.config/retroarch/steam.cfg`
# (launch options), so these apply on top of retroarch.cfg only under Steam; the
# desktop launch is unaffected. Deployed as a symlink at ~/.config/retroarch/steam.cfg.

# Big Picture opens games on the primary display (the TV when steam-tv-display
# is on), so a borderless fullscreen on monitor 0 lands where Big Picture is.
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_monitor_index = "0"
ui_menubar_enable = "false"

# Steam Input exposes a virtual "X-Box 360 pad" and hides the physical one via
# SDL_GAMECONTROLLER_IGNORE_DEVICES. The udev driver ignores that hint and sees
# both pads (double input); sdl2 respects it. Keyboard stays on the x driver.
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
all_users_control_menu = "true"

# Controller-only navigation: L3+R3 toggles the menu, L1+R1+Start+Select quits.
# Guide/Home is owned by Steam and opens the overlay instead.
input_menu_toggle_gamepad_combo = "2"
input_quit_gamepad_combo = "3"
quit_press_twice = "false"
menu_show_quit_retroarch = "true"

# Do NOT write the merged config back to retroarch.cfg on exit, otherwise these
# overrides leak into the desktop launch. Persistent setting changes belong in
# retroarch.cfg (desktop) or here.
config_save_on_exit = "false"
