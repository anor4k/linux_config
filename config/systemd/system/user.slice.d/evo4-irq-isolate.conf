# Keep user-session tasks off CPU 5, which evo4-irq-isolate reserves for the
# EVO4's USB controller interrupt. Firefox/Steam threads entering amdgpu's
# display paths were stalling that CPU for 10-14 ms with interrupts off; with
# this in place: 0 stalls in 120 s (was 47, 8 of them audible).
# Must match EVO4_IRQ_CPU in bin/evo4-irq-isolate and the CPU count (16).
# Install: /etc/systemd/system/user.slice.d/evo4-irq-isolate.conf
[Slice]
AllowedCPUs=0-4,6-15
