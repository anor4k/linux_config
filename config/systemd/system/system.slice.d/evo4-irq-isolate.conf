# Same as user.slice.d/evo4-irq-isolate.conf, for system services. Optional:
# the measured stalls all came from user-session threads, but system daemons
# that touch the GPU (e.g. sddm) could in principle do the same.
# Install: /etc/systemd/system/system.slice.d/evo4-irq-isolate.conf
[Slice]
AllowedCPUs=0-4,6-15
