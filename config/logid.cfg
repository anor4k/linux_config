// Ignore the G923 racing wheel (PID 0xc26e); logiops can't init it and
// spams "Failed to add device" warnings otherwise.
ignore: [0xc26e];

devices: (
    {
        name: "MX Master 3S";
        dpi: 1600;
        smartshift:
        {
            on: true;
            threshold: 30;
        }
        hiresscroll:
        {
            hires: false;
            target: false;
        }
        buttons: (
            {
                cid: 0x00c4;
                action =
                {
                    type: "Keypress";
                    keys: ["KEY_MICMUTE"];
                }
            }
        )
    }
);

